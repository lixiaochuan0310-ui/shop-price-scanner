name: Diagnose scanner crash

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shop-price-scanner-apk
          run-id: 41800671726
          github-token: ${{ github.token }}
          path: apk

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm || true

      - name: Test scanner on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            bash -c '
            adb install "$(find apk -type f -name "*.apk" -print -quit)" > install.txt 2>&1;
            adb shell pm grant com.localpricescan.app android.permission.CAMERA;
            adb logcat -c;
            adb shell am start -W -n com.localpricescan.app/.MainActivity > launch.txt 2>&1;
            sleep 4;
            adb shell uiautomator dump /sdcard/window.xml > dump.txt 2>&1;
            adb pull /sdcard/window.xml window.xml > pull.txt 2>&1;
            adb shell input tap 160 240;
            sleep 10;
            adb logcat -d -b crash -v threadtime > crash.txt;
            adb logcat -d -v threadtime > full-log.txt;
            grep -Ei "FATAL EXCEPTION|AndroidRuntime|localpricescan|zxing|Camera" full-log.txt | tail -n 350 > filtered-log.txt;
            adb shell dumpsys activity activities > activity.txt;
            exit 0
            '

      - name: Upload diagnosis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-crash-logs
          path: |
            install.txt
            launch.txt
            window.xml
            crash.txt
            filtered-log.txt
            activity.txt
          if-no-files-found: warn
